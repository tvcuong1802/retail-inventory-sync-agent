# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level — do NOT nest them under an `agent:`
# block. The nested shape is invisible to the registry: namespace/enabled fall back to
# defaults and the registry key degrades to "default/unknown@latest".
id: "RET-C2-267"
name: "Retail Omnichannel Inventory Sync & Fulfillment Orchestration Agent"
namespace: "ret"
version: "1.0.6"
enabled: true
category: "Cat 2"
industry: "RET"

# Base picklist pattern reference ONLY — not the inheritance target.
base_type: "AgentBaseGraph"

# Entry point — ONE dotted import path (module.Class). A `module:` + `class:` pair
# resolves to `<module>.<class>`, which for a package only exists if __init__.py
# re-exports it — it did not, in any of the 19 templates measured 2026-09-11.
class: "src.graph.graph.FulfillmentOrchestrationGraph"

# Security — VERIFIED_EXTERNAL is what the Marketplace runner supplies. INTERNAL is
# reserved for admin / GitOps callers and makes the S-1 gate refuse every request.
required_trust_level: "VERIFIED_EXTERNAL"

requires:
  secrets:
    - AZURE_OPENAI_API_KEY
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_DEPLOYMENT
  extras:
    - openai

# Runtime parameters live in config/config.yaml — cli.py passes it as Graph(config=...).
